<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cartGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1020" height="540" fill="url(#bgGrad2)" rx="14" />
  <rect x="2" y="2" width="1016" height="536" fill="none" stroke="#cbd5e1" stroke-width="2" rx="12" />

  <!-- Header -->
  <rect x="24" y="16" width="972" height="64" fill="#ffffff" rx="8" filter="url(#shadow2)" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="44" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    2. DISCRETE STATE SPACE (|S| = 5) &amp; CONATUS SURVIVAL BARRIER
  </text>
  <text x="44" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">
    Partitioning continuous tilt angle θ into 5 conative balance zones and the ±35° Point of No Return
  </text>

  <!-- Stage Box -->
  <rect x="24" y="94" width="630" height="426" fill="#ffffff" rx="10" filter="url(#shadow2)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Track -->
  <line x1="45" y1="380" x2="615" y2="380" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 55 380 L 45 390 M 115 380 L 105 390 M 175 380 L 165 390 M 235 380 L 225 390 M 295 380 L 285 390 M 355 380 L 345 390 M 415 380 L 405 390 M 475 380 L 465 390 M 535 380 L 525 390 M 595 380 L 585 390" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pivot Origin: (320, 360) -->
  <!-- Angular Sector Wedges (Radius = 230) -->
  <!-- Green Safe Zone: -3° to +3° -->
  <path d="M 320 360 L 308 131 A 230 230 0 0 1 332 131 Z" fill="#ecfdf5" opacity="0.9" />
  <!-- Amber Mild Zone: -15° to +15° -->
  <path d="M 320 360 L 260 138 A 230 230 0 0 1 308 131 Z" fill="#fef3c7" opacity="0.7" />
  <path d="M 320 360 L 332 131 A 230 230 0 0 1 380 138 Z" fill="#fef3c7" opacity="0.7" />
  <!-- Red Severe Zone: -35° to +35° -->
  <path d="M 320 360 L 188 172 A 230 230 0 0 1 260 138 Z" fill="#fee2e2" opacity="0.6" />
  <path d="M 320 360 L 380 138 A 230 230 0 0 1 452 172 Z" fill="#fee2e2" opacity="0.6" />

  <!-- Conatus VETO Limits at ±35° -->
  <line x1="320" y1="360" x2="188" y2="172" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <line x1="320" y1="360" x2="452" y2="172" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" />
  <text x="175" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">
    Conatus VETO (-35°)
  </text>
  <text x="465" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">
    Conatus VETO (+35°)
  </text>

  <!-- State Rays (Length = 220px from Pivot (320, 360)) -->
  <!-- s2 (l2: Severe Left, θ = -26°) -> (224, 162) -->
  <line x1="320" y1="360" x2="224" y2="162" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3" />
  <circle cx="224" cy="162" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <text x="210" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">
    s₂ (l₂: Fall Left)
  </text>

  <!-- s1 (l1: Mild Left, θ = -12°) -> (274, 145) -->
  <line x1="320" y1="360" x2="274" y2="145" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4,2" />
  <circle cx="274" cy="145" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
  <text x="260" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="end">
    s₁ (l₁: Tilt Left)
  </text>

  <!-- s0 (0: Upright Balance, θ = 0°) -> (320, 140) -->
  <line x1="320" y1="360" x2="320" y2="140" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
  <circle cx="320" cy="140" r="11" fill="#10b981" stroke="#047857" stroke-width="2.5" />
  <text x="320" y="112" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">
    s₀ (0: Upright Stance)
  </text>
  <text x="320" y="128" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">
    C₀ = 0.0 (Min Free Energy)
  </text>

  <!-- s3 (r1: Mild Right, θ = +12°) -> (366, 145) -->
  <line x1="320" y1="360" x2="366" y2="145" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4,2" />
  <circle cx="366" cy="145" r="8" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
  <text x="380" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706">
    s₃ (r₁: Tilt Right)
  </text>

  <!-- s4 (r2: Severe Right, θ = +26°) -> (416, 162) -->
  <line x1="320" y1="360" x2="416" y2="162" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="5,3" />
  <circle cx="416" cy="162" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <text x="430" y="152" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">
    s₄ (r₂: Fall Right)
  </text>

  <!-- Cart Body -->
  <rect x="260" y="345" width="120" height="28" fill="url(#cartGrad2)" rx="5" stroke="#1e40af" stroke-width="2" filter="url(#shadow2)" />
  <circle cx="285" cy="375" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="355" cy="375" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="320" cy="360" r="5" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />

  <!-- Bottom Explanatory Banner -->
  <rect x="40" y="445" width="598" height="55" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
  <text x="55" y="468" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">
    🎯 Conative Discretization: 5 States condense full 360° dynamics into actionable control bins.
  </text>
  <text x="55" y="488" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
    Excursions beyond ±35° enter the irreversible tipping regime where motor torque cannot arrest gravitational fall.
  </text>

  <!-- Right Legend Panel -->
  <g transform="translate(674, 94)">
    <rect width="322" height="426" fill="#ffffff" rx="10" filter="url(#shadow2)" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Title -->
    <rect x="15" y="15" width="292" height="28" fill="#f1f5f9" rx="5" />
    <text x="25" y="34" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">
      CONATIVE 5-STATE ONTOLOGY
    </text>

    <!-- State list with clear vertical padding (no collisions!) -->
    <g transform="translate(20, 58)">
      <!-- s0 -->
      <circle cx="10" cy="8" r="6" fill="#10b981" />
      <text x="24" y="12" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">
        s₀ : 0 (Upright Equilibrium)
      </text>
      <text x="24" y="27" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
        Preference C₀ = 0.0, Vitality Φ = 1.00
      </text>

      <!-- s1 -->
      <circle cx="10" cy="46" r="6" fill="#f59e0b" />
      <text x="24" y="50" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">
        s₁ : l₁ (Mild Tilt Left, θ ≈ -12°)
      </text>
      <text x="24" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
        Preference C = -1.5, Vitality Φ = 0.70
      </text>

      <!-- s2 -->
      <circle cx="10" cy="84" r="6" fill="#ef4444" />
      <text x="24" y="88" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">
        s₂ : l₂ (Severe Fall Left, θ ≈ -26°)
      </text>
      <text x="24" y="103" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
        Preference C = -8.0, Vitality Φ = 0.15
      </text>

      <!-- s3 -->
      <circle cx="10" cy="122" r="6" fill="#f59e0b" />
      <text x="24" y="126" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">
        s₃ : r₁ (Mild Tilt Right, θ ≈ +12°)
      </text>
      <text x="24" y="141" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
        Preference C = -1.5, Vitality Φ = 0.70
      </text>

      <!-- s4 -->
      <circle cx="10" cy="160" r="6" fill="#ef4444" />
      <text x="24" y="164" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">
        s₄ : r₂ (Severe Fall Right, θ ≈ +26°)
      </text>
      <text x="24" y="179" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">
        Preference C = -8.0, Vitality Φ = 0.15
      </text>
    </g>

    <!-- Conatus Gate Callout Box -->
    <rect x="15" y="275" width="292" height="135" fill="#fef2f2" rx="8" stroke="#fecaca" stroke-width="1.5" />
    <text x="25" y="298" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b91c1c">
      CONATUS VETO LIMIT
    </text>
    <text x="25" y="320" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#991b1b">
      • Critical Angle Threshold: |θ| ≥ 35°
    </text>
    <text x="25" y="338" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#7f1d1d">
      Point where gravity exceeds actuator torque.
    </text>
    <text x="25" y="360" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">
      • Conative Protection Rule:
    </text>
    <text x="25" y="378" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#7f1d1d">
      If predicted Φ &lt; 0.25 nats: Expected Free Energy
    </text>
    <text x="25" y="394" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">
      G* → +∞ (Instantaneous Conatus VETO)
    </text>
  </g>
</svg>