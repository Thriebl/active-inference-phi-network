<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" width="1020" height="680">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    
    <!-- Markers -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2563eb" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#8b5cf6" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#dc2626" />
    </marker>
    <marker id="arrowDark" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#475569" />
    </marker>

    <!-- Filters -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="680" fill="url(#bgGrad)" rx="16" />
  <rect x="2" y="2" width="1016" height="676" fill="none" stroke="#cbd5e1" stroke-width="2" rx="14" />

  <!-- Title & Header Bar -->
  <rect x="24" y="20" width="972" height="68" fill="#ffffff" rx="10" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="44" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a" letter-spacing="0.5">
    PLANAR 2D INVERTED PENDULUM: KINEMATICS &amp; STREAMLINED ACI MATRICES
  </text>
  <text x="44" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Planar Single-Axis Balancing (|S| = 5 States, |A| = 2 Actions): Left/Right Counter-Steering under Conatus Axiom 6 Veto
  </text>

  <!-- ======================================================================== -->
  <!-- LEFT PANEL: PHYSICAL KINEMATIC STAGE (PLANAR 2D)                         -->
  <!-- ======================================================================== -->
  <g transform="translate(30, 105)">
    <!-- Stage Box -->
    <rect width="640" height="545" fill="#ffffff" rx="12" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Floor Track & Ground -->
    <line x1="30" y1="460" x2="610" y2="460" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Hatching under ground -->
    <path d="M 40 460 L 25 475 M 80 460 L 65 475 M 120 460 L 105 475 M 160 460 L 145 475 M 200 460 L 185 475 M 240 460 L 225 475 M 280 460 L 265 475 M 320 460 L 305 475 M 360 460 L 345 475 M 400 460 L 385 475 M 440 460 L 425 475 M 480 460 L 465 475 M 520 460 L 505 475 M 560 460 L 545 475 M 600 460 L 585 475" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- 1D Linear Motion Axis Helper (X: Left ↔ Right) -->
    <g transform="translate(60, 485)">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#475569" stroke-width="2" marker-end="url(#arrowDark)" />
      <text x="110" y="4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">X-Axis (Linear Cart Motion)</text>
    </g>

    <!-- Pivot Origin: X = 320, Y = 440 -->
    <!-- Safe / Critical Angle Sector Backgrounds -->
    <!-- Green Safe Wedge: -3° to +3° -->
    <path d="M 320 440 L 306 185 A 255 255 0 0 1 334 185 Z" fill="#ecfdf5" opacity="0.9" />
    <!-- Amber Wedge: -15° to +15° (excluding safe) -->
    <path d="M 320 440 L 254 194 A 255 255 0 0 1 306 185 Z" fill="#fef3c7" opacity="0.6" />
    <path d="M 320 440 L 334 185 A 255 255 0 0 1 386 194 Z" fill="#fef3c7" opacity="0.6" />
    <!-- Red Hazard Wedge: -30° to +30° -->
    <path d="M 320 440 L 193 219 A 255 255 0 0 1 254 194 Z" fill="#fee2e2" opacity="0.6" />
    <path d="M 320 440 L 386 194 A 255 255 0 0 1 447 219 Z" fill="#fee2e2" opacity="0.6" />

    <!-- Irreversible Fall Horizons (Axiom 6 Conatus Barrier at ±35°) -->
    <line x1="320" y1="440" x2="160" y2="231" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="320" y1="440" x2="480" y2="231" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" />
    <text x="140" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="end">
      Axiom 6 VETO Limit (-35°)
    </text>
    <text x="500" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">
      Axiom 6 VETO Limit (+35°)
    </text>

    <!-- State Deflection Rods (Length = 260px from Pivot (320, 440)) -->

    <!-- State s2: Left Severe Hazard Tilt (θ = -26°) -> (320 - 114, 440 - 233) = (206, 207) -->
    <line x1="320" y1="440" x2="206" y2="207" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,3" />
    <circle cx="206" cy="207" r="9" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
    <text x="195" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="end">
      s₂ (l₂: Fall Left)
    </text>

    <!-- State s1: Left Mild Tilt (θ = -12°) -> (320 - 54, 440 - 254) = (266, 186) -->
    <line x1="320" y1="440" x2="266" y2="186" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5,2" />
    <circle cx="266" cy="186" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <text x="255" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706" text-anchor="end">
      s₁ (l₁: Tilt Left)
    </text>

    <!-- State s0: Upright Equilibrium (θ = 0°) -> (320, 180) -->
    <!-- Vertical Baseline (extended dashed) -->
    <line x1="320" y1="440" x2="320" y2="120" stroke="#059669" stroke-width="2" stroke-dasharray="4,4" />
    <!-- Upright Stance Rod -->
    <line x1="320" y1="440" x2="320" y2="180" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <circle cx="320" cy="180" r="12" fill="#10b981" stroke="#047857" stroke-width="2.5" />
    <text x="320" y="152" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">
      s₀ (0: Upright Balance)
    </text>
    <text x="320" y="168" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">
      Homeostasis C₀ = 0.0 (Min Free Energy)
    </text>

    <!-- State s3: Right Mild Tilt (θ = +12°) -> (320 + 54, 440 - 254) = (374, 186) -->
    <line x1="320" y1="440" x2="374" y2="186" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="374" cy="186" r="9" fill="#f59e0b" stroke="#b45309" stroke-width="2" />
    <text x="385" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d97706">
      s₃ (r₁: Tilt Right)
    </text>

    <!-- State s4: Right Severe Hazard Tilt (θ = +26°) -> (320 + 114, 440 - 233) = (434, 207) -->
    <line x1="320" y1="440" x2="434" y2="207" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="434" cy="207" r="11" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5" />
    <text x="450" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626">
      s₄ (r₂: Fall Right)
    </text>

    <!-- Angular Measurement Arc (θ) between vertical and s4 -->
    <path d="M 320 320 A 120 120 0 0 1 372 332" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)" />
    <text x="356" y="312" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">
      +θ (Tilt Angle)
    </text>

    <!-- Physical Forces Acting on Center of Mass (CoM at 434, 207) -->
    <line x1="434" y1="207" x2="434" y2="295" stroke="#8b5cf6" stroke-width="3.5" marker-end="url(#arrowPurple)" />
    <text x="444" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">
      F_g = m · g (Gravity)
    </text>
    <!-- Overturning Torque Arc -->
    <path d="M 450 220 A 45 45 0 0 1 454 260" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowPurple)" />
    <text x="466" y="245" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">
      τ_grav = m g L sin(θ)
    </text>

    <!-- The Base Cart at Pivot (320, 440) -->
    <rect x="270" y="425" width="100" height="30" fill="url(#cartGrad)" rx="6" stroke="#1e40af" stroke-width="2" filter="url(#softShadow)" />
    <circle cx="290" cy="455" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="350" cy="455" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
    <!-- Pivot Pin -->
    <circle cx="320" cy="440" r="5" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />

    <!-- COUNTER-STEERING ACTION VECTOR (a = r) -->
    <line x1="380" y1="440" x2="490" y2="440" stroke="#2563eb" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowBlue)" />
    <rect x="385" y="405" width="235" height="28" fill="#eff6ff" rx="5" stroke="#93c5fd" stroke-width="1" />
    <text x="502" y="424" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">
      ACTION a = r : Accelerate Right ➔
    </text>

    <!-- Physical Explanation Callout Banner at bottom of stage -->
    <rect x="25" y="480" width="590" height="52" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="40" y="501" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">
      💡 The Planar Balancing Principle: If rod falls Right (r₁ / r₂), base accelerates RIGHT (a = r).
    </text>
    <text x="40" y="521" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#475569">
      Accelerating the pivot under the displaced Center of Mass swings the rod back to vertical (0).
    </text>
  </g>

  <!-- ======================================================================== -->
  <!-- RIGHT PANEL: STREAMLINED 5-STATE ONTOLOGY & 5x5 MATRICES                 -->
  <!-- ======================================================================== -->
  <g transform="translate(690, 105)">
    <!-- Legend Box -->
    <rect width="300" height="545" fill="url(#panelGrad)" rx="12" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Sub-Panel 1: Streamlined 5-State Space -->
    <rect x="15" y="15" width="270" height="150" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1" />
    <text x="28" y="36" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">
      1. STREAMLINED STATES (|S| = 5)
    </text>
    
    <!-- State 0 -->
    <circle cx="36" cy="56" r="6" fill="#10b981" />
    <text x="50" y="60" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">
      s₀ : 0 (Upright, C₀ = 0.0, Φ = 1.00)
    </text>

    <!-- State Left -->
    <circle cx="36" cy="78" r="6" fill="#f59e0b" />
    <text x="50" y="82" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">
      s₁ : l₁ (Tilt Left, C = -1.5, Φ = 0.70)
    </text>
    <circle cx="36" cy="98" r="6" fill="#ef4444" />
    <text x="50" y="102" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">
      s₂ : l₂ (Fall Left, C = -8.0, Φ = 0.15)
    </text>

    <!-- State Right -->
    <circle cx="36" cy="118" r="6" fill="#f59e0b" />
    <text x="50" y="122" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">
      s₃ : r₁ (Tilt Right, C = -1.5, Φ = 0.70)
    </text>
    <circle cx="36" cy="138" r="6" fill="#ef4444" />
    <text x="50" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#991b1b">
      s₄ : r₂ (Fall Right, C = -8.0, Φ = 0.15)
    </text>

    <!-- Sub-Panel 2: Actions (|A| = 2) -->
    <rect x="15" y="177" width="270" height="130" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1" />
    <text x="28" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">
      2. ACTIONS (|A| = 2)
    </text>

    <text x="28" y="222" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
      • a = 0 (l) : Accelerate LEFT ⬅
    </text>
    <text x="42" y="238" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">
      Restores l₁ ➔ 0 (P = 0.88), rescues l₂ ➔ l₁
    </text>

    <text x="28" y="260" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">
      • a = 1 (r) : Accelerate RIGHT ➔
    </text>
    <text x="42" y="276" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#64748b">
      Restores r₁ ➔ 0 (P = 0.88), rescues r₂ ➔ r₁
    </text>

    <text x="28" y="296" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#475569">
      Exact 5×5 B-matrices B(l) and B(r)
    </text>

    <!-- Sub-Panel 3: 5x5 Matrix Simplicity -->
    <rect x="15" y="320" width="270" height="210" fill="#f8fafc" rx="8" stroke="#cbd5e1" stroke-width="1" />
    <text x="28" y="342" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">
      3. 5×5 GENERATIVE TENSORS
    </text>

    <text x="28" y="364" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">
      • Likelihood Matrix A (5×5):
    </text>
    <text x="40" y="378" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      Diagonal precision γ = 0.92, noise ε = 0.04
    </text>

    <text x="28" y="398" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">
      • Transition Tensors B (2 × 5×5):
    </text>
    <text x="40" y="412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      B(l) and B(r) capture planar Newton-Euler physics
    </text>

    <text x="28" y="432" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0f172a">
      • Vectors C &amp; D (5 elements):
    </text>
    <text x="40" y="446" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      C = [0.0, -1.5, -8.0, -1.5, -8.0]
    </text>
    <text x="40" y="460" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
      D = [0.92, 0.04, 0.00, 0.04, 0.00]
    </text>

    <text x="28" y="482" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">
      • Conatus Gate (Axiom 6 VETO):
    </text>
    <text x="40" y="496" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#7f1d1d">
      If Φ &lt; 0.25 (tilt &gt; ±35°):
      <tspan font-weight="700" fill="#dc2626">G* ➔ +∞ (Autonomous Hardware VETO)</tspan>
    </text>
  </g>
</svg>
