  </text>

  <!-- Gravity Vector F_g -->
  <line x1="405" y1="194" x2="405" y2="280" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowPurple3)" />
  <text x="415" y="250" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">
