    </text>
    <text x="25" y="54" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#065f46">
      • s₀ (0) : Upright (C₀ = 0.0, Φ = 1.00)
    </text>
    <text x="25" y="72" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#92400e">
      • s₁ (l₁) / s₃ (r₁) : Mild Tilt (C = -1.5, Φ = 0.70)
    </text>
    <text x="25" y="90" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#991b1b">
