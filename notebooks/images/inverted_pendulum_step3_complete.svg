    </text>
    <text x="25" y="328" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">
      • Dynamics B(l), B(r) (5×5): Exact planar physics
    </text>
    <text x="25" y="346" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">
      • Preference C: [0.0, -1.5, -8.0, -1.5, -8.0]
    </text>
    <text x="25" y="364" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">
      • Prior D: [0.92, 0.04, 0.00, 0.04, 0.00]
    </text>
    <text x="25" y="382" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155">
      • Vitality Φ: [1.00, 0.70, 0.15, 0.70, 0.15]
    </text>

    <!-- Section 4: Conatus Axiom 6 VETO -->
    <rect x="15" y="405" width="292" height="106" fill="#fef2f2" rx="6" stroke="#fecaca" stroke-width="1.5" />
    <text x="25" y="425" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#b91c1c">
