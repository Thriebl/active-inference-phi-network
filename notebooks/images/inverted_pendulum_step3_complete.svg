    </text>
    <text x="25" y="463" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#7f1d1d">
      If a proposed policy leads to collapse hazard:
    </text>
    <text x="25" y="482" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#dc2626">
