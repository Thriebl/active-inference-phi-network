  </text>
  <text x="44" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#64748b">
    Full Closed-Loop Architecture: Left/Right Counter-Steering, Active Torques, and Axiom 6 Veto Gate
  </text>

  <!-- Left Physical Stage Box -->
  <rect x="24" y="94" width="630" height="526" fill="#ffffff" rx="10" filter="url(#shadow3)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Ground Rail at y = 430 -->
  <line x1="45" y1="430" x2="615" y2="430" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <path d="M 55 430 L 45 440 M 115 430 L 105 440 M 175 430 L 165 440 M 235 430 L 225 440 M 295 430 L 285 440 M 355 430 L 345 440 M 415 430 L 405 440 M 475 430 L 465 440 M 535 430 L 525 440 M 595 430 L 585 440" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pivot Origin: (300, 410) -->

  <!-- Angular Sector Backgrounds (Radius = 240) -->
  <path d="M 300 410 L 287 171 A 240 240 0 0 1 313 171 Z" fill="#ecfdf5" opacity="0.9" />
  <path d="M 300 410 L 238 178 A 240 240 0 0 1 287 171 Z" fill="#fef3c7" opacity="0.6" />
  <path d="M 300 410 L 313 171 A 240 240 0 0 1 362 178 Z" fill="#fef3c7" opacity="0.6" />
  <path d="M 300 410 L 162 213 A 240 240 0 0 1 238 178 Z" fill="#fee2e2" opacity="0.6" />
  <path d="M 300 410 L 362 178 A 240 240 0 0 1 438 213 Z" fill="#fee2e2" opacity="0.6" />

  <!-- Axiom 6 Conatus Barrier at ±35° -->
  <line x1="300" y1="410" x2="162" y2="213" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" />
  <line x1="300" y1="410" x2="438" y2="213" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" />
  <text x="150" y="205" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="end">
