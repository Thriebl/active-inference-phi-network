  </text>
  <text x="450" y="205" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#b91c1c">
    VETO (+35°)
  </text>

  <!-- State Rays -->
  <!-- s2: Fall Left (θ = -26°) -->
  <line x1="300" y1="410" x2="195" y2="194" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,3" />
  <circle cx="195" cy="194" r="7" fill="#ef4444" />
  <text x="185" y="186" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="end">
