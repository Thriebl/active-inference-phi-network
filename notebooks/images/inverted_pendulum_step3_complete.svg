  </text>

  <!-- s4: Severe Tilt Right (Active Physical State, θ = +26°) -> Tip at (405, 194) -->
  <line x1="300" y1="410" x2="405" y2="194" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
  <circle cx="405" cy="194" r="12" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5" />
  <text x="422" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8">
