  <rect x="245" y="395" width="110" height="28" fill="url(#cartGrad3)" rx="5" stroke="#1e40af" stroke-width="2" filter="url(#shadow3)" />
  <circle cx="270" cy="425" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="330" cy="425" r="7" fill="#334155" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="300" cy="410" r="5" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2" />

  <!-- Counter-Steering Action Vector a = r (Cleanly Positioned, No Overlap) -->
  <line x1="365" y1="409" x2="475" y2="409" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round" marker-end="url(#arrowBlue3)" />
  <rect x="375" y="375" width="220" height="26" fill="#eff6ff" rx="4" stroke="#93c5fd" stroke-width="1" />
  <text x="485" y="392" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">
