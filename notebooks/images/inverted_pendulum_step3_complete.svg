  <!-- Physical Insight Callout at Bottom of Stage -->
  <rect x="35" y="460" width="608" height="48" fill="#f8fafc" rx="6" stroke="#cbd5e1" stroke-width="1" />
  <text x="50" y="480" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">
