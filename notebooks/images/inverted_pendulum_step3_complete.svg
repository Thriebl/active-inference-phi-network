  </text>

  <!-- Tilt Angle Arc (+θ) -->
  <path d="M 300 295 A 115 115 0 0 1 346 306" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed3)" />
  <text x="330" y="285" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">
