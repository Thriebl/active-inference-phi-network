  </text>
  <text x="50" y="497" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#475569">
    Matrix B(r) captures this Newton-Euler transition: P(s₀ | r₁, a=r) = 0.88, P(r₁ | r₂, a=r) = 0.85.
  </text>

  <!-- Right Legend Panel -->
  <g transform="translate(674, 94)">
    <rect width="322" height="526" fill="#ffffff" rx="10" filter="url(#shadow3)" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Section 1: 5-State Space -->
    <rect x="15" y="14" width="292" height="135" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="33" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
