  </text>

  <!-- s0: Upright Balance (θ = 0°) -->
  <line x1="300" y1="410" x2="300" y2="170" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="300" cy="170" r="10" fill="#10b981" stroke="#047857" stroke-width="2" />
  <text x="300" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#047857" text-anchor="middle">
