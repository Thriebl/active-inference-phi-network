    </text>

    <!-- Section 2: Actions -->
    <rect x="15" y="160" width="292" height="100" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="180" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
      2. ACTIONS (|A| = 2)
    </text>
    <text x="25" y="202" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">
