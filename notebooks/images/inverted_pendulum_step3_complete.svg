  </text>
  <!-- Overturning Torque Arc -->
  <path d="M 420 205 A 40 40 0 0 1 425 245" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="3,2" marker-end="url(#arrowPurple3)" />
  <text x="435" y="230" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#7c3aed">
