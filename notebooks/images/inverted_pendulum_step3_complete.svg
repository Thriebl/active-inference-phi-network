  </text>

  <!-- s3: Tilt Right (θ = +12°) -->
  <line x1="300" y1="410" x2="350" y2="175" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,2" />
  <circle cx="350" cy="175" r="7" fill="#f59e0b" />
  <text x="360" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d97706">
