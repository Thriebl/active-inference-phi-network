    </text>
    <text x="35" y="252" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#475569">
      Restores r₁ → s₀ (P = 0.88), rescues r₂ → r₁
    </text>

    <!-- Section 3: 5x5 Generative Model -->
    <rect x="15" y="270" width="292" height="125" fill="#f8fafc" rx="6" stroke="#e2e8f0" stroke-width="1" />
    <text x="25" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a">
